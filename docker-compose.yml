# Self-hosted models behind API keys: one public entry point, everything else private.
#
#   caddy     HTTPS on 80/443 (automatic Let's Encrypt certificate for DOMAIN)
#   api       the gateway — API keys, rate limits, queue, usage log; OpenAI,
#             Anthropic and Ollama-format endpoints
#   ollama    the model runtime; reachable only by the api
#   speech    speech-to-text (Whisper); reachable only by the api
#   postgres  API keys (hashed) and the usage log
#
# Start:     docker compose up -d --build
# With GPU:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Settings:  .env (scripts/setup.sh creates it from .env.example)

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (run scripts/setup.sh)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ai:${POSTGRES_PASSWORD:?run scripts/setup.sh}@postgres:5432/ai
      OLLAMA_URL: http://ollama:11434
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen3:8b}
      MODEL_CONCURRENCY: ${OLLAMA_NUM_PARALLEL:-1}
      QUEUE_TIMEOUT_SECONDS: ${QUEUE_TIMEOUT_SECONDS:-120}
      DEFAULT_RATE_LIMIT_PER_MINUTE: ${DEFAULT_RATE_LIMIT_PER_MINUTE:-30}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SPEECH_URL: http://speech:8000
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      MAX_AUDIO_MB: ${MAX_AUDIO_MB:-100}
      CHAT_MODELS: ${CHAT_MODELS:-}
      EMBEDDING_MODELS: ${EMBEDDING_MODELS:-}
      MODEL_ALIASES: ${MODEL_ALIASES:-}
      THINKING: ${THINKING:-model}
    volumes:
      - ./benchmarks:/srv/benchmarks

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Keep the model in memory between requests; reloading a multi-GB model
      # on every call adds tens of seconds.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      # Requests served at once. Each costs a full context of memory, and on a
      # CPU server more parallelism only splits the same cores.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      # Models kept in memory at once; others load on demand and push out the
      # least recently used.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      OLLAMA_CONTEXT_LENGTH: ${NUM_CTX:-12288}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
    # Hard cap so a model that is too big fails to load instead of pushing
    # Postgres and the API out of memory. Size it to the server (README).
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-14g}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  speech:
    build: ./speech
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}
      MAX_UPLOAD_MB: ${MAX_AUDIO_MB:-100}
    # Transcription uses every core it is given; cap it so the language models
    # keep the rest. The model (~1.5 GB in memory) loads on first use.
    cpus: ${SPEECH_CPUS:-4}
    mem_limit: ${SPEECH_MEMORY_LIMIT:-3g}
    volumes:
      - speech_models:/models

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai
      POSTGRES_DB: ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  ollama_models:
  speech_models:
  postgres_data:
