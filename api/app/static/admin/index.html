<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Model server — Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314181d'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%233ddc97'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <!-- Sign-in -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="off">
      <div class="brand brand-lg"><span class="dot"></span>Model server</div>
      <p class="muted">Admin console. Sign in with the <code>ADMIN_TOKEN</code> from the server's <code>.env</code>.</p>
      <label for="token">Admin token</label>
      <input id="token" type="password" required spellcheck="false" autocomplete="current-password">
      <label class="check"><input id="remember" type="checkbox"> Keep me signed in on this device</label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </main>

  <!-- Console -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="dot" id="runtime-dot"></span>Model server</div>
      <div class="host mono" id="host"></div>
      <nav aria-label="Sections">
        <a href="#overview" data-page="overview">Overview</a>
        <a href="#models" data-page="models">Models</a>
        <a href="#keys" data-page="keys">API keys</a>
        <a href="#usage" data-page="usage">Usage</a>
        <a href="#playground" data-page="playground">Playground</a>
      </nav>
      <div class="sidebar-foot">
        <a href="/docs" target="_blank" rel="noopener">API docs ↗</a>
        <button id="signout" class="link">Sign out</button>
      </div>
    </aside>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</body>
</html>
